<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site_config.site_name }}{% endblock %}</title>
    <!--
        PLACEHOLDER LAYOUT — none of the real front-end templates/CSS
        were provided, so this is a minimal working stand-in.
        Swap in your real static/style.css and markup here.
    -->
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; color: #1c1c1e; }
        header { background: #1a9e30; color: #fff; padding: 14px 20px; }
        header nav a { color: #fff; margin-right: 16px; text-decoration: none; font-size: 14px; }
        main { padding: 20px; max-width: 960px; margin: 0 auto; }
        footer { padding: 20px; text-align: center; font-size: 13px; color: #666; }
    </style>
</head>
<body>
    <header>
        <strong>{{ site_config.site_name }}</strong>
        <nav style="margin-top:8px;">
            <a href="{% url 'index' %}">Home</a>
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'products' %}">Products</a>
            <a href="{% url 'blog_list' %}">Blog</a>
            <a href="{% url 'contact' %}">Contact</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        {{ site_config.footer_developer_text }}
    </footer>
</body>
</html>
