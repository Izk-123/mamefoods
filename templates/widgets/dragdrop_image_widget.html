{% load static %}
<div class="dropzone" id="dropzone-{{ widget.attrs.id }}">
    <div class="dz-message">
        <p>Drag & drop an image here, or click to select</p>
    </div>
    {{ widget.input }}
</div>

<script>
    (function() {
        const dropzone = document.getElementById('dropzone-{{ widget.attrs.id }}');
        const fileInput = dropzone.querySelector('input[type="file"]');

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                // Trigger HTMX to upload the file asynchronously
                htmx.trigger(fileInput, 'change');
            }
        });

        fileInput.addEventListener('change', (e) => {
            // Show preview or upload via HTMX
            const file = e.target.files[0];
            if (file) {
                // Here you can upload via HTMX or just display the file name
                console.log('Selected file:', file.name);
            }
        });
    })();
</script>
