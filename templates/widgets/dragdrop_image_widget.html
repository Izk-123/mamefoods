{% load static %}
<div class="dropzone" id="{{ widget.attrs.id }}">
    <div class="dz-message">
        <p>Drag & drop an image here, or click to select</p>
    </div>
    {{ widget }}
</div>

<script>
    (function() {
        const dropzone = document.getElementById('{{ widget.attrs.id }}');
        const fileInput = dropzone.querySelector('input[type="file"]');

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                // Trigger HTMX change event if you want to upload automatically
                htmx.trigger(fileInput, 'change');
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                // Show a preview
                const reader = new FileReader();
                reader.onload = function(event) {
                    let preview = dropzone.querySelector('img');
                    if (!preview) {
                        preview = document.createElement('img');
                        preview.style.maxWidth = '100%';
                        preview.style.maxHeight = '150px';
                        preview.style.marginTop = '10px';
                        dropzone.appendChild(preview);
                    }
                    preview.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
    })();
</script>
